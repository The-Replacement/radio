# MediaMTX — the WebRTC leg.
#
# It does not touch the camera: ffmpeg is still the only one opening
# /dev/video0 and pushing the already-encoded H.264 over RTSP. Here it is only
# repackaged into RTP.
#
# Why it exists: HLS is segment-based and does not go below ~1.5s of cushion.
# WebRTC sends frames as soon as they come out, with a jitter buffer of tens of
# ms.
#
# The consequence to keep in mind: the signalling request (SDP) does go through
# Caddy and through the gate, but the video does NOT. It travels over direct UDP
# from the browser to this container, and Caddy never sees it. See
# docker-compose.yml.
logLevel: info

# Input from ffmpeg (Docker's internal network, not published).
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Outputs we do not use: less surface, fewer ports.
rtmp: no
hls: no
srt: no
api: no
playback: no

# Salida WebRTC.
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Without this MediaMTX announces the container's internal IPs (172.x), which
# the browser cannot reach. The ICE candidates have to be addresses the browser
# does see. For LAN or the internet, add the public IP or the domain here, and
# publish the UDP on 0.0.0.0.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

paths:
  cam:
    # ffmpeg publishes; nobody else writes to this path.
    source: publisher
