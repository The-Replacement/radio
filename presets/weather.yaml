# Mario — weather report (The Meteorologist).
# Spoken weather segment from a local snapshot. Deterministic and cached by (weather_snapshot_hash, time_bucket).
# template_version bumps to invalidate cached weather segments.
template_version: mario/weather/1

# Valid-weather phrase template. Fields: temperature, wind_dir, wind_speed, sky.
template: "From the Sierras de los Comechingones: {temperature}, wind from the {wind_dir} at {wind_speed}, sky {sky}."

# Deterministic fallback when snapshot is missing or invalid.
fallback: "Weather report unavailable from the Sierras. Stay tuned."
