<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Radio</title>
<!-- Icono inline data-URI: sin archivo y sin request. Sin esto el
     navegador pide /favicon.ico por default y como web/ no lo tiene,
     devuelve 404 en consola. El tile replica el punto "en vivo". -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0b0d'/><circle cx='16' cy='16' r='7' fill='%2335d07f'/></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0b0d; color: #e8e8ea;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(92vw, 26rem); padding: 2rem; text-align: center; }
  .dot {
    width: .6rem; height: .6rem; border-radius: 50%; background: #555;
    display: inline-block; margin-right: .5rem; vertical-align: middle;
    transition: background .3s;
  }
  .dot.live { background: #35d07f; animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(53,208,127,.6); }
    70% { box-shadow: 0 0 0 .5rem rgba(53,208,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,208,127,0); }
  }
  .estado { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: #9a9aa2; }
  h1 { font-size: 1.4rem; margin: 1.2rem 0 .3rem; letter-spacing: -.01em; }
  .now { color: #9a9aa2; font-size: .95rem; min-height: 1.5em; margin: 0 0 1.6rem; }
  button {
    width: 4.2rem; height: 4.2rem; border-radius: 50%; border: 0; cursor: pointer;
    background: #e8e8ea; color: #0b0b0d; font-size: 1.5rem; line-height: 1;
    display: inline-grid; place-items: center; transition: transform .15s;
  }
  button:hover { transform: scale(1.05); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  audio { display: none; }
  .cam {
    margin-top: 1.8rem; border-radius: .6rem; overflow: hidden;
    background: #000; line-height: 0; box-shadow: 0 0 0 1px #1d1d22;
  }
  .cam video { display: block; width: 100%; height: auto; }
  .debug {
    margin-top: .8rem; font: 12px/1.4 ui-monospace, monospace;
    color: #6f6f78; white-space: pre-line; text-align: left;
  }
  .err { margin-top: 1.5rem; color: #ff8a8a; font-size: .9rem; display: none; text-align: left; }
  .aviso { margin-top: 1.5rem; color: #9a9aa2; font-size: .85rem; display: none; text-align: left; }
  .tel { margin-top: 2rem; color: #55555c; font-size: .72rem; letter-spacing: .06em; }
</style>
</head>
<body>
<main>
  <div class="estado"><span class="dot" id="dot"></span><span id="estado">detenido</span></div>
  <h1>Radio</h1>
  <p class="now" id="now">&nbsp;</p>
  <button id="play" aria-label="Reproducir">&#9654;</button>
  <div class="aviso" id="aviso"></div>
  <div class="err" id="err"></div>
  <div class="tel" id="tel"></div>
  <!-- `hidden` de entrada: sin cámara, la caja no existe. Aparece sola
       cuando hay playlist. `muted` no es opcional: un video con audio no
       puede arrancar solo en ningún navegador. -->
  <div class="cam" id="cam-caja" hidden>
    <video id="cam" muted playsinline autoplay></video>
  </div>
  <!-- Sólo se llena con ?debug=1. Sirve para saber si el retraso es del
       reproductor o del pipeline, sin abrir DevTools. -->
  <p class="debug" id="debug"></p>
  <audio id="audio" preload="none"></audio>
</main>
<script>
(function () {
  var audio = document.getElementById('audio');
  var btn = document.getElementById('play');
  var dot = document.getElementById('dot');
  var estado = document.getElementById('estado');
  var now = document.getElementById('now');
  var err = document.getElementById('err');
  var aviso = document.getElementById('aviso');
  var tel = document.getElementById('tel');

  tel.textContent = location.host;

  /*
    Normalmente el token ya no está en la URL: el servidor lo canjeó por
    una cookie antes de servir esta página. Igual lo leemos, porque sirve
    para reproductores y como respaldo si el navegador no guarda cookies.
  */
  var t = new URLSearchParams(location.search).get('t');
  var sufijo = t ? '?t=' + encodeURIComponent(t) : '';

  // Backend (Icecast/Caddy) vive en otro origen tras el split: el frontend
  // está en Cloudflare Pages (radio.daza.ar) y el backend en el tunnel
  // (stream.daza.ar). Las cookies usan Domain=.daza.ar, así que el gate
  // sigue funcionando cross-origin.
  var BACKEND_URL = 'https://stream.daza.ar';

  /*
    Reconexión automática. Un stream en vivo se corta: cambia la red, el
    equipo suspende, el proxy recicla una conexión. Antes de eso la página
    daba el error definitivo al primer hipo, que es lo que se veía: el
    audio conectaba, sonaba unos segundos y al cortarse quedaba un cartel
    de "pedí un link nuevo" — cuando el link estaba perfecto.
  */
  var reintentos = 0;
  var MAX_REINTENTOS = 5;
  var ultimoCodigo = 0;
  var sinCredencial = false;
  // ¿Hay una cadena de reconexión en vuelo? Ver alFallar().
  var reintentando = false;

  function conectar(autoplay) {
    audio.crossOrigin = 'use-credentials';
    audio.src = BACKEND_URL + '/stream' + sufijo;
    if (!autoplay) return;
    audio.play().catch(function () {
      // play() rechaza si el pedido falla o si el navegador bloquea el
      // autoplay. El segundo caso no se arregla reintentando: lo resuelve
      // el click.
    });
  }

  /*
    Antes de decidir si vale la pena reintentar, se le pregunta al mismo
    gate por otro recurso. Si /status-json.xsl también da 404, la credencial
    es el problema y reintentar no sirve. Si responde, el corte fue de red o
    del servidor, y reintentar sí sirve. Sin esto, un Caddy reiniciándose se
    confundía con un token vencido: el navegador recibe 404 en los dos casos.
  */
  function alFallar() {
    /*
      Una sola cadena por corte. Para el MISMO incidente pueden apilarse
      varios disparadores — el watchdog (tiempo congelado), un `ended`
      (Icecast patea la conexión), el `error` del reintento — y cada uno
      llamaría a reintentar() por su cuenta: sin esta guarda el
      presupuesto de 5 se quema en ~5s en vez de los ~12s del backoff, y
      una fuente que vuelve a los 8s llega con el contador agotado.
      Medido: kick a los 11s con watchdog+ended disparando juntos ->
      fallo definitivo antes de que la fuente volviera.

      OJO: la cadena AVANZA por los eventos de cada intento (falla ->
      error/ended -> alFallar -> siguiente intento), así que la guarda no
      puede quedarse puesta: se abre apenas corre el reintento agendado
      (ver reintentar()). Si no, la cadena muere clavada en (1/5) —
      medido también.
    */
    if (reintentando) return;
    reintentando = true;
    fetch(BACKEND_URL + '/status-json.xsl' + sufijo, { cache: 'no-store', credentials: 'include' })
      .then(function (r) { sinCredencial = r.status === 404; })
      .catch(function () { sinCredencial = false; })
      .then(function () {
        if (sinCredencial) { falloDefinitivo(); return; }
        reintentar();
      });
  }

  function reintentar() {
    reintentos++;
    if (reintentos > MAX_REINTENTOS) { falloDefinitivo(); return; }
    err.style.display = 'block';
    err.textContent = 'Se cortó el stream. Reconectando (' + reintentos +
                      '/' + MAX_REINTENTOS + ')...';
    estado.textContent = 'reconectando';
    dot.classList.remove('live');
    setTimeout(function () {
      // El intento corre: con esto, los eventos del SU fallo (error o
      // ended) vuelven a abrir alFallar() y la cadena sigue. Mientras
      // estaba agendado, la guarda cohibía a los disparadores duplicados
      // del mismo corte.
      reintentando = false;
      conectar(true);
    }, 800 * reintentos);
  }

  /*
    ¿Está sonando de verdad? `audio.paused` miente durante un corte: Chrome
    queda en readyState 2 con paused:false esperando datos que no llegan
    (el mismo estado que describe el watchdog abajo). Si el botón confía en
    paused, un corte deja el elemento "no pausado" y el click llama a
    pause() en vez de reconectar: botón muerto hasta recargar a mano.

    Sonando real es !paused Y con datos frescos para seguir (readyState >= 3,
    HAVE_FUTURE_DATA). Con un stream en vivo eso sólo se da cuando de verdad
    fluyen datos; si está en 0-2, no está sonando y conviene reconectar.
  */
  function sonando() {
    return !audio.paused && audio.readyState >= 3;
  }

  btn.addEventListener('click', function () {
    if (sonando()) { audio.pause(); }
    else { conectar(true); }
  });
  audio.addEventListener('playing', function () {
    reintentos = 0;
    reintentando = false;
    reproduciendo = true;
    btn.innerHTML = '&#10073;&#10073;';
    estado.textContent = 'en vivo';
    dot.classList.add('live');
    err.style.display = 'none';
  });
  audio.addEventListener('pause', function () {
    btn.innerHTML = '&#9654;';
    // El `pause` que dispara cada intento fallido no debe pisar el cartel:
    // mientras hay cadena en vuelo la página está reconectando, no
    // detenido (sin esto la UI contradecía al cartel "Reconectando (n/5)").
    if (!reintentando) estado.textContent = 'detenido';
    dot.classList.remove('live');
  });
  audio.addEventListener('error', function () {
    ultimoCodigo = audio.error ? audio.error.code : 0;
    reproduciendo = false;
    alFallar();
  });

  /*
    Cierre limpio del servidor: si Icecast pateó la conexión (fuente ausente
    más de su timeout), Chrome ve fin de stream y NO un error. Sin este
    listener la página queda muda en "detenido" para siempre: no hay error
    que llame a alFallar() y el watchdog se corta en cuanto paused pasa a
    true. Medido con pause de liquidsoap: ended a los 11s y la página no
    volvió sola ni con la fuente restaurada.

    Un fin de stream entra por la misma pregunta que un error: ¿se cayó la
    credencial o fue la red? alFallar() ya lo decide. ultimoCodigo=0 porque
    un cierre limpio no trae código de error (el stale de un corte anterior
    confundiría el mensaje final).
  */
  audio.addEventListener('ended', function () {
    ultimoCodigo = 0;
    reproduciendo = false;
    alFallar();
  });

  function falloDefinitivo() {
    // Se libera la cadena: si el usuario reintenta a mano y vuelve a
    // fallar, eso debe empezar un presupuesto nuevo, no quedar bloqueado.
    reintentando = false;
    err.style.display = 'block';
    err.innerHTML = sinCredencial
      ? 'El servidor respondió 404.<br>El acceso venció o el navegador no guardó ' +
        'la cookie. Pedí un link nuevo.'
      : 'No se pudo conectar con el stream' +
        (ultimoCodigo ? ' (error ' + ultimoCodigo + ')' : '') + '.<br>' +
        'Se cortó la conexión y no volvió. Revisá la red.';
    dot.classList.remove('live');
    estado.textContent = 'error';
  }

  /*
    Watchdog. Un corte de red no siempre dispara `error`: Chrome se queda en
    readyState 2 con `paused:false` esperando datos que no llegan, para
    siempre. Verificado cortando Caddy en medio de la reproducción.

    OJO con el arranque: al principio currentTime es 0 mientras bufferea, y
    eso NO es un corte. Por eso sólo vigila después del primer `playing`; si
    contara desde el principio, cortaría toda reproducción sana a los 3s.
  */
  var ultimoT = 0;
  var quieto = 0;
  var reproduciendo = false;

  setInterval(function () {
    if (!reproduciendo || audio.paused) {
      ultimoT = audio.currentTime;
      quieto = 0;
      return;
    }
    if (audio.currentTime > ultimoT + 0.01) {
      ultimoT = audio.currentTime;
      quieto = 0;
      return;
    }
    quieto++;
    if (quieto >= 3) {
      quieto = 0;
      reproduciendo = false;
      ultimoT = audio.currentTime;
      alFallar();
    }
  }, 1000);

  // "Sonando ahora": consulta el estado de Icecast cada 15 s.
  function actualizarEstado() {
    fetch(BACKEND_URL + '/status-json.xsl' + sufijo, { cache: 'no-store', credentials: 'include' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        // Icecast reporta el mount activo en icestats.source. Si no hay
        // source, el stream no está al aire (liquidsoap caído o sin música).
        // OJO: listeners=0 NO significa detenido; es gente escuchando ahora.
        var src = data && data.icestats && data.icestats.source;
        if (src) {
          // ESTADO EN VIVO
          dot.classList.add('live');
          estado.textContent = 'en vivo';
          now.textContent = (src.server_name || src.server_description || 'Radio') + '\u00a0';
          btn.disabled = false;
          aviso.style.display = 'none';
          if (sonando()) {
            btn.innerHTML = '&#10073;&#10073;';
          }
        } else {
          // ESTADO DETENIDO (sin source activo)
          dot.classList.remove('live');
          estado.textContent = 'detenido';
          now.textContent = '';
          btn.disabled = true;
          aviso.style.display = 'block';
          aviso.textContent = 'La transmisión está detenida';
        }
      })
      .catch(function () {
        // FALLBACK: backend inalcanzable (box off, tunnel down, o error de red)
        dot.classList.remove('live');
        estado.textContent = 'detenido';
        now.textContent = '';
        btn.disabled = true;
        aviso.style.display = 'block';
        aviso.textContent = 'Radio fuera del aire';
      });
  }

  // Verificación inmediata al cargar la página
  actualizarEstado();

  // Luego cada 15 s (mismo intervalo que el poll original)
  setInterval(actualizarEstado, 15000);

  // "Sonando ahora" - también actualiza el título cada 15 s (código existente, sin modificar)
  function poll() {
    fetch(BACKEND_URL + '/status-json.xsl' + sufijo, { cache: 'no-store', credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var ic = d && d.icestats && d.icestats.source;
        if (!ic) return;
        var s = Array.isArray(ic) ? ic[0] : ic;
        var titulo = s.title || s.yp_currently_playing || s.server_name || '';
        now.textContent = titulo || '\u00a0';
        if (titulo) document.title = titulo + ' — Radio';
      })
      .catch(function () { /* silencio: es solo el cartel */ });
  }
  poll();
  setInterval(poll, 15000);

  /*
    ------------------------------------------------------------------
    La cámara. Video mudo: el audio es el de la radio y nada más.
    ------------------------------------------------------------------

    Se pregunta primero si hay playlist (HEAD). Si no la hay, la caja no
    aparece y no se carga hls.js siquiera. Eso cubre el caso normal de
    "la cámara está desenchufada" sin que el usuario vea un recuadro negro
    ni un error.
  */
  var caja = document.getElementById('cam-caja');
  var cam = document.getElementById('cam');
  var hlsCam = null;
  var pcWebrtc = null;

  function mostrar() { caja.hidden = false; }

  function porWebrtc() {
    /*
      WebRTC primero: es el único transporte de navegador que no espera a
      que se cierre un segmento. El jitter buffer son decenas de ms, no
      segundos.

      El pedido de señalización (POST del SDP) va por Caddy y pasa el gate
      como cualquier otro request. El video NO: viaja por UDP directo a
      mediamtx. Si el UDP no llega, no hay track y se cae a HLS.
    */
    var pc = new RTCPeerConnection();
    pcWebrtc = pc;
    pc.addTransceiver('video', { direction: 'recvonly' });

    var primerFrame = new Promise(function (listo, fallo) {
      pc.addEventListener('track', function (e) {
        cam.srcObject = e.streams[0] || new MediaStream([e.track]);
        cam.play().catch(function () {});
        mostrar();
        listo();
      });
      // Sin track no hay video: mejor fallback que un rectángulo negro.
      setTimeout(function () { fallo(new Error('sin track')); }, 6000);
    });

    return pc.createOffer()
      .then(function (of) { return pc.setLocalDescription(of); })
      .then(function () { return esperarIce(pc); })
      .then(function () {
        return fetch(BACKEND_URL + '/cam/whep' + sufijo, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });
      })
      .then(function (r) {
        if (!r.ok) throw new Error('whep ' + r.status);
        return r.text();
      })
      .then(function (sdp) {
        return pc.setRemoteDescription({ type: 'answer', sdp: sdp });
      })
      .then(function () { return primerFrame; })
      .catch(function (e) {
        pc.close();
        pcWebrtc = null;
        throw e;
      });
  }

  // WHEP sin trickle: hay que mandar el SDP con los candidatos ya juntados.
  function esperarIce(pc) {
    return new Promise(function (listo) {
      if (pc.iceGatheringState === 'complete') return listo();
      var corte = setTimeout(listo, 2000);
      pc.addEventListener('icegatheringstatechange', function () {
        if (pc.iceGatheringState === 'complete') { clearTimeout(corte); listo(); }
      });
    });
  }

  function porHls() {
    /*
      Fallback. hls.js PRIMERO, aunque el navegador diga que reproduce HLS
      nativo: Chrome 154 responde "maybe" a canPlayType y su implementación
      nativa bufferea ~10s sin perilla. Costó dos diagnósticos equivocados.
    */
    var s = document.createElement('script');
    s.src = '/vendor/hls.light.min.js';
    s.onload = function () {
      if (window.Hls && window.Hls.isSupported()) { hlsConLib(); return; }
      nativo();
    };
    s.onerror = nativo;
    document.head.appendChild(s);
  }

  function nativo() {
    if (!cam.canPlayType('application/vnd.apple.mpegurl')) return;
    cam.crossOrigin = 'use-credentials';
    cam.src = t
      ? BACKEND_URL + '/cam/' + encodeURIComponent(t) + '/index.m3u8'
      : BACKEND_URL + '/cam/index.m3u8';
    cam.addEventListener('loadedmetadata', mostrar);
    cam.play().catch(function () { /* autoplay bloqueado: da igual, es mudo */ });
  }

  function hlsConLib() {
    /*
      liveSyncDuration en SEGUNDOS (hls.js: liveSyncPosition = liveEdge -
      targetLatency), así que no depende del tamaño del segmento.

      Por qué 1.5 y no menos: medido con Chrome headless sobre este stream,
      1.0 daba 1.1s pero con hipos (readyState caía a 2 de vez en cuando: se
      quedaba sin buffer en el borde). 1.5 da 1.56s sostenidos, sin un solo
      hipo en 30s. Ese es el piso de HLS con segmentos de 1s.
    */
    var hls = new window.Hls({
      xhrSetup: function (xhr) { xhr.withCredentials = true; },
      fetchSetup: function (request, init) { return new Request(request, { credentials: 'include' }); },
      liveSyncDuration: 1.5,
      liveMaxLatencyDuration: 5,
      maxLiveSyncPlaybackRate: 1.5,
      backBufferLength: 15
    });
    hlsCam = hls;
    hls.loadSource(t
      ? BACKEND_URL + '/cam/' + encodeURIComponent(t) + '/index.m3u8'
      : BACKEND_URL + '/cam/index.m3u8');
    hls.attachMedia(cam);
    hls.on(window.Hls.Events.MANIFEST_PARSED, function () { mostrar(); });
    hls.on(window.Hls.Events.ERROR, function (nada, datos) {
      // Fatal = no hay forma de seguir. Se esconde la caja en vez de
      // dejar un rectángulo negro congelado.
      if (datos && datos.fatal) { caja.hidden = true; hls.destroy(); }
    });
    cam.play().catch(function () {});
  }

  function arrancar() {
    if (!window.RTCPeerConnection) { porHls(); return; }
    porWebrtc().catch(function () { porHls(); });
  }

  arrancar();

  /*
    ?debug=1 muestra cuánto está atrasado el reproductor respecto del vivo.
    Es la única forma de distinguir "el pipeline tarda" de "el player espera"
    sin abrir DevTools. Si el número es ~2, el servidor está bien y el vídeo
    se ve con 2s de retraso; si es 10, la config no se aplicó.
  */
  if (new URLSearchParams(location.search).has('debug')) {
    var dbg = document.getElementById('debug');
    setInterval(function () {
      if (pcWebrtc) {
        // En WebRTC no hay "posición en la playlist": lo que se mide es el
        // jitter buffer del receptor, que es casi todo el retraso del tramo.
        pcWebrtc.getStats().then(function (stats) {
          var ms = null;
          stats.forEach(function (r) {
            if (r.type === 'inbound-rtp' && r.kind === 'video' &&
                r.jitterBufferEmittedCount) {
              ms = (r.jitterBufferDelay / r.jitterBufferEmittedCount) * 1000;
            }
          });
          dbg.textContent = 'transporte: webrtc  |  jitter buffer: ' +
            (ms === null ? '?' : ms.toFixed(0) + ' ms') +
            '  |  t: ' + cam.currentTime.toFixed(1) + 's';
        });
        return;
      }
      if (!hlsCam) { dbg.textContent = 'transporte: HLS nativo'; return; }
      dbg.textContent =
        'transporte: hls.js  |  latencia: ' + hlsCam.latency.toFixed(2) + 's' +
        '  |  objetivo: ' + (hlsCam.targetLatency === null ? '?' : hlsCam.targetLatency.toFixed(2)) + 's' +
        '  |  velocidad: ' + cam.playbackRate.toFixed(2) + 'x';
    }, 1000);
  }
})();
</script>
</body>
</html>
