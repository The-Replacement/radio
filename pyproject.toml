[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mario"
version = "0.1.0"
description = "Mario — the host voice for the radio. A deterministic TTS generator inspired by Mario Pergolini (in living tribute)."
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Juan Manuel Daza", email = "juanmanueldaza@gmail.com" }]
keywords = ["tts", "radio", "deterministic", "voice", "host"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "piper-tts==1.8.0",
  "pydantic==2.14.1",
  "typer==0.27.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]
kokoro = [
  "kokoro-onnx>=0.4.0",
  "soundfile>=0.12.0",
]

[project.scripts]
mario = "mario.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mario"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mario"]
mypy_path = "src"
