# Private radio with a token — Icecast + Liquidsoap + Caddy (+ indiegenerator)
#
# Design principle: Icecast and Liquidsoap do NOT publish ports.
# The only thing exposed to the host is Caddy, which acts as the only door.
# Without the correct token, neither the stream nor the player is visible.
# indiegenerator generates/rotates ./music and restarts liquidsoap every cycle.

services:
  icecast:
    build: ./icecast
    container_name: radio-icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?missing from .env}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?missing from .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?missing from .env}
    networks:
      - radio
    # No "ports" section: Icecast is unreachable from outside this network.
    # No log volumes: it writes to stdout (see <logging> in icecast.xml).

  liquidsoap:
    # Pinned by digest: reproducibility of the exact image running today.
    image: savonet/liquidsoap:v2.4.6@sha256:1d4ecfc1b53851c5f018d1ada430302a0678f789a6e96f6de5264255f679689c
    container_name: radio-liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?missing from .env}
    volumes:
      - ./liquidsoap/radio.liq:/etc/radio.liq:ro
      # SDD #65 (T0 locked): audio-only scan root. meta_root (catalog/sidecars)
      # remains ./music, served to Caddy/Mario but NOT scanned by Liquidsoap.
      - ./music-audio:/music:ro
      # Mario (the host voice): pre-rendered segments, read-only. Mounted at
      # /host so radio.liq can play them between tracks. Never under /music:
      # Liquidsoap must not scan them into the playlist.
      - ./data/host:/host:ro
      # Jingles pool (DJ): short audio clips played occasionally between tracks.
      # Never under /music: Liquidsoap must not scan them into the playlist.
      - ./jingles:/jingles:ro
    # The generator publishes with an atomic rename, so it writes each file
    # first into an audio-root .tmp and renames it to the final name. That
    # staging must not be visible to `playlist("/music")`. An empty tmpfs mounted
    # over /music/.tmp covers that folder in the audio-only scan root.
    tmpfs:
      - /music/.tmp:size=1m
    command: ["--verbose", "/etc/radio.liq"]
    networks:
      - radio

  # MediaMTX: repackages the H.264 as RTP/WebRTC. It does not open the camera.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2@sha256:c7540465f868a02652118bea5a0daab12a29ac0f6cb8485abd535939ecddf886
    container_name: radio-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # The WebRTC video goes over direct UDP from the browser to the
      # container: it does NOT go through Caddy. Tied to loopback on purpose:
      # today, this machine only. For LAN: change to "8189:8189/udp" AND add the
      # IP to mediamtx.yml's webrtcAdditionalHosts. For the internet: also open
      # the port on the router.
      - "127.0.0.1:${WEBRTC_UDP_PORT:-8189}:8189/udp"
    networks:
      - radio

  # The camera. It talks to nobody: it writes HLS segments in ./data/cam and
  # pushes RTSP to mediamtx. Caddy serves the files; WebRTC goes separately.
  cam:
    build: ./cam
    container_name: radio-cam
    restart: unless-stopped
    depends_on:
      - mediamtx
    devices:
      # by-id and NOT /dev/videoN on purpose: the number depends on the order
      # the kernel enumerates cameras. If you reconnect the FaceCam or plug in
      # another one, /dev/video2 can become /dev/video4. This path always points
      # at the FaceCam (index0 = capture node; index1 is metadata and is useless
      # for capturing).
      - "${CAM_DEVICE:-/dev/v4l/by-id/usb-KYE_Systems_Corp._FaceCam_1000X-video-index0}:/dev/video0"
    environment:
      # CAM_CLOCK=1 burns the time into the frame, to measure delay. Off.
      CAM_CLOCK: ${CAM_CLOCK:-0}
    volumes:
      - ./data/cam:/out
      # Mounted and not just baked in: that way editing capture.sh is a
      # `restart`, not a rebuild. Same as radio.liq in liquidsoap and the
      # Caddyfile.
      - ./cam/capture.sh:/usr/local/bin/capture.sh:ro
    networks:
      - radio
    # If the camera is unplugged at start-up, this container does NOT start.
    # That is correct: better an `up` that fails than empty video with no
    # explanation.

  # Generates the music and replaces the library every cycle. Liquidsoap sees
  # the new files through watch, but it does NOT forget deletions: that is why
  # the cycle restarts liquidsoap after rotating (INDIEGEN_RESTART).
  #
  # Requires the indiegenerator repo available as the build context (by default
  # ../indiegenerator on the mainframe).
  #
  # Restart in signal mode: the generator writes
  # /var/lib/indiegen/restart-request (volume ./data/indiegen) and a HOST watcher
  # (cron + scripts/restart-on-signal.sh) runs `docker compose restart
  # liquidsoap`. /var/run/docker.sock is NOT mounted: the socket inside a
  # container is root-equivalent over the whole host, and this box also runs
  # jellyfin/searxng/archive. The radio decides its own restart.
  indiegen:
    build:
      context: ${INDIEGEN_CONTEXT:-../indiegenerator}
      dockerfile: Dockerfile
    container_name: radio-indiegen
    restart: unless-stopped
    # Runs as the host user who owns ./music and ./data/indiegen, not as root.
    # By default the container is root, so everything it writes (tracks, json,
    # state.json, runs/, restart-request) ends up root:root and any host tool
    # that wants to rewrite it hits EACCES. Measured: uid 1000 against a
    # root:root state.json gives "Permission denied", and mkdir inside a root:root
    # runs/ does too. Without :? a new deployment would start silently with the
    # wrong uid and only fail on the first cycle, so the value is mandatory in
    # .env.
    user: "${INDIEGEN_UID:?INDIEGEN_UID missing from .env}:${INDIEGEN_GID:?INDIEGEN_GID missing from .env}"
    depends_on:
      - liquidsoap
    environment:
      INDIEGEN_PRESET: ${INDIEGEN_PRESET:-station}
      INDIEGEN_COUNT: ${INDIEGEN_COUNT:-10}
      INDIEGEN_SEED_BASE: ${INDIEGEN_SEED_BASE:-1000}
      INDIEGEN_SEED_STRATEGY: ${INDIEGEN_SEED_STRATEGY:-advance}
      INDIEGEN_INTERVAL_SECONDS: ${INDIEGEN_INTERVAL_SECONDS:-21600}
      INDIEGEN_RESTART: ${INDIEGEN_RESTART:-signal:/var/lib/indiegen/restart-request}
    # SDD #65 (T0 locked): dual-root publish (audio_root + meta_root).
    # REQUIRES coordinated indiegenerator update supporting --audio-dir/--meta-dir
    # (lockstep deploy via INDIEGEN_CONTEXT). Do not deploy this compose change
    # without the matching indiegen image/CLI and migration.
    command:
      [
        "serve",
        "--audio-dir", "/music-audio",
        "--meta-dir", "/music-meta",
        "--work-dir", "/var/lib/indiegen",
        "--presets-dir", "/app/presets",
        "--preset", "${INDIEGEN_PRESET:-station}",
        "--count", "${INDIEGEN_COUNT:-10}",
        "--seed-base", "${INDIEGEN_SEED_BASE:-1000}",
        "--seed-strategy", "${INDIEGEN_SEED_STRATEGY:-advance}",
        "--interval-seconds", "${INDIEGEN_INTERVAL_SECONDS:-21600}",
        "--restart", "${INDIEGEN_RESTART:-signal:/var/lib/indiegen/restart-request}",
        "--trigger-file", "/var/lib/indiegen/trigger",
        "--no-run-on-start",
      ]
    volumes:
      - ./music-audio:/music-audio
      - ./music:/music-meta
      - ./data/indiegen:/var/lib/indiegen
    networks:
      - radio

  # Mario (the host voice): generates spoken segments between tracks. Runs on
  # demand (`docker compose run --rm mario generate ...`), not as a long-lived
  # service — mirroring indiegenerator's build pattern but on-demand. The
  # watcher (scripts/restart-on-signal.sh) and an hourly cron
  # (scripts/mario-refresh.sh) trigger it. Output lands in ./data/host, mounted
  # into Liquidsoap and Caddy (see the mounts below).
  mario:
    build:
      context: ./
      dockerfile: Dockerfile.mario
    container_name: radio-mario
    restart: "no"
    # The host resolves through systemd-resolved's stub (nameserver 127.0.0.53).
    # Docker classifies that as an internal resolver and drops it, leaving the
    # container's /etc/resolv.conf with NO nameservers at all - every lookup
    # fails with "Name or service not known". That silently kills RSS fetches.
    # Pin the real upstreams: LAN router first, public resolver as fallback.
    dns:
      - 192.168.100.1
      - 1.1.1.1
    environment:
      # SDD #65 (T0 locked): meta_root ./music holds catalog/sidecars (served at
      # /music/*). Audio lives in ./music-audio and is not needed by Mario.
      MARIO_MUSIC_DIR: /music
      MARIO_META_DIR: /music
      MARIO_HOST_DIR: /data/host
      # Bundled presets (liners/weather/rss) ship in the image at /app/presets.
      # The package is installed, not checked out, so presets are not beside
      # __file__; this makes the location explicit instead of a fallback guess.
      MARIO_PRESETS_DIR: /app/presets
      # News slot. The feeds file is station-specific config (versioned in this
      # repo, mounted read-only); the cache must live on the host bind mount or
      # it dies with the container and every run refetches from cold.
      MARIO_RSS_FEEDS_FILE: /etc/mario/feeds.yaml
      MARIO_RSS_CACHE_DIR: /data/host/rss-cache
      MARIO_TTS_BACKEND: ${MARIO_TTS_BACKEND:-piper}
      MARIO_MODEL: ${MARIO_MODEL:-/models/piper/es_ES-sharvard-medium.onnx}
      MARIO_VOICES_PATH: ${MARIO_VOICES_PATH:-/models/kokoro/voices-v1.0.bin}
      MARIO_VOICE: ${MARIO_VOICE:-am_adam}
      MARIO_TIME_BUCKET_HOURS: ${MARIO_TIME_BUCKET_HOURS:-1}
      MARIO_MODEL_LANG: ${MARIO_MODEL_LANG:-es}
      MARIO_TEMPLATE_VERSION: ${MARIO_TEMPLATE_VERSION:-mario/2}
    volumes:
      - ./music:/music:ro
      - ./data/host:/data/host
      - ./config/feeds.yaml:/etc/mario/feeds.yaml:ro
      - /home/kbdejavu/Models/kokoro:/models/kokoro:ro
      - /home/kbdejavu/Models/piper:/models/piper:ro
    networks:
      - radio

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: radio-caddy
    restart: unless-stopped
    depends_on:
      - icecast
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      COOKIE_FLAGS: ${COOKIE_FLAGS:-HttpOnly; SameSite=Lax; Secure}
      # The frontend's origin (Cloudflare Pages in production). The exchange
      # redirects here when it finishes and CORS allows this origin. Locally the
      # frontend is this same Caddy (http://localhost:8090).
      # CAREFUL: no trailing slash — it is used as the origin in CORS and the
      # Location.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # The directory, not the files: git changes the working tree with a
      # rename+swap (new inode), and Docker bind-mounts the FILE by inode — the
      # container keeps the old version forever and `caddy reload` reloads
      # garbage with no effect. With the directory, the swap is visible and the
      # hot reload works without restarting anything.
      # (We already know this trick with tokens.caddy: there, "write in place"
      # closes the gap because it does not go through git; the Caddyfile does).
      - ./caddy:/etc/caddy:ro
      - ./web:/srv:ro
      # The camera's segments. Caddy serves them as files: there is no proxy, no
      # other port, no other place to authenticate.
      #
      # CAREFUL with the path: it can NOT be /srv/cam. Docker mounts ./web:/srv:ro
      # first (it sorts by path) and then cannot create /srv/cam inside a
      # read-only mount: "Read-only file system (os error 30)". That is why the
      # directory goes to /srv-cam and the Caddyfile uses handle_path.
      - ./data/cam:/srv-cam:ro
      # SDD #65 (T0 locked): meta_root (catalog/sidecars), served at /music/*.
      # Read-only: the radio only reads metadata, never writes.
      - ./music:/srv-music:ro
      # Mario (the host voice): pre-rendered segments, served under the door.
      - ./data/host:/srv-host:ro
      - ./data/caddy:/data
    networks:
      - radio

networks:
  radio:
    driver: bridge
