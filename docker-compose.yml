# Radio privada con token — Icecast + Liquidsoap + Caddy (+ indiegenerator)
#
# Principio de diseño: Icecast y Liquidsoap NO publican puertos.
# Lo único expuesto al host es Caddy, que hace de única puerta.
# Sin el token correcto, no se ve ni el stream ni el player.
# indiegenerator genera/rota ./music y reinicia liquidsoap en cada ciclo.

services:
  icecast:
    build: ./icecast
    container_name: radio-icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?falta en .env}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?falta en .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?falta en .env}
    networks:
      - radio
    # Sin sección "ports": Icecast es inalcanzable desde fuera de esta red.
    # Sin volúmenes de log: escribe a stdout (ver <logging> en icecast.xml).

  liquidsoap:
    # Fijado por digest: reproducibilidad de la imagen exacta que corre hoy.
    image: savonet/liquidsoap:v2.4.6@sha256:1d4ecfc1b53851c5f018d1ada430302a0678f789a6e96f6de5264255f679689c
    container_name: radio-liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?falta en .env}
    volumes:
      - ./liquidsoap/radio.liq:/etc/radio.liq:ro
      - ./music:/music:ro
    # El generador publica con rename atómico, así que escribe cada archivo
    # primero en ./music/.tmp y lo renombra al nombre final. Ese staging vive
    # DENTRO del árbol que este contenedor escanea: `playlist("/music")`
    # recorre subdirectorios, así que Liquidsoap intentaba decodificar los
    # archivos a medio escribir (y los .mix viejos que quedaban ahí). Un
    # tmpfs vacío montado sobre /music/.tmp le tapa esa carpeta: el generador
    # sigue viendo la real, Liquidsoap ve un directorio vacío. Medido: con el
    # canary en el host, adentro se ven 0 entradas.
    tmpfs:
      - /music/.tmp:size=1m
    command: ["--verbose", "/etc/radio.liq"]
    networks:
      - radio

  # MediaMTX: reempaqueta el H.264 como RTP/WebRTC. No abre la cámara.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2@sha256:c7540465f868a02652118bea5a0daab12a29ac0f6cb8485abd535939ecddf886
    container_name: radio-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # El video WebRTC va por UDP directo del navegador al contenedor: NO
      # pasa por Caddy. Atado a loopback a propósito: hoy sólo esta máquina.
      # Para LAN: cambiar a "8189:8189/udp" Y agregar la IP al
      # webrtcAdditionalHosts de mediamtx.yml. Para internet: además abrir
      # el puerto en el router.
      - "127.0.0.1:${WEBRTC_UDP_PORT:-8189}:8189/udp"
    networks:
      - radio

  # La cámara. No habla con nadie: escribe segmentos HLS en ./data/cam y
  # empuja RTSP a mediamtx. Caddy sirve los archivos; el WebRTC va aparte.
  cam:
    build: ./cam
    container_name: radio-cam
    restart: unless-stopped
    depends_on:
      - mediamtx
    devices:
      # by-id y NO /dev/videoN a propósito: el número depende del orden en
      # que el kernel enumera las cámaras. Si reconectás la FaceCam o
      # enchufás otra, /dev/video2 puede pasar a ser /dev/video4.
      # Este path apunta siempre a la FaceCam (index0 = nodo de captura;
      # index1 es metadata y no sirve para capturar).
      - "${CAM_DEVICE:-/dev/v4l/by-id/usb-KYE_Systems_Corp._FaceCam_1000X-video-index0}:/dev/video0"
    environment:
      # CAM_CLOCK=1 quema la hora en el cuadro, para medir retraso. Apagado.
      CAM_CLOCK: ${CAM_CLOCK:-0}
    volumes:
      - ./data/cam:/out
      # Montado y no sólo horneado: así editar capture.sh es un `restart`,
      # no un rebuild. Igual que radio.liq en liquidsoap y el Caddyfile.
      - ./cam/capture.sh:/usr/local/bin/capture.sh:ro
    networks:
      - radio
    # Si la cámara está desenchufada al levantar, este contenedor NO arranca.
    # Es correcto: mejor un `up` que falla que un video vacío sin explicación.

  # Genera la música y reemplaza la biblioteca en cada ciclo. Liquidsoap ve
  # los archivos nuevos por watch, pero NO olvida los borrados: por eso el
  # ciclo reinicia liquidsoap después de rotar (INDIEGEN_RESTART).
  #
  # Requiere el repo de indiegenerator disponible como contexto de build
  # (por defecto ../indiegenerator en el mainframe).
  #
  # Restart en modo signal: el generador escribe /var/lib/indiegen/restart-request
  # (volumen ./data/indiegen) y un watcher del HOST (cron + scripts/restart-on-signal.sh)
  # hace el `docker compose restart liquidsoap`. NO se monta /var/run/docker.sock:
  # el socket en un contenedor es root-equivalente sobre todo el host, y este
  # box también corre jellyfin/searxng/archive. La radio decide su propio reinicio.
  indiegen:
    build:
      context: ${INDIEGEN_CONTEXT:-../indiegenerator}
      dockerfile: Dockerfile
    container_name: radio-indiegen
    restart: unless-stopped
    # Corre como el usuario del host que es dueño de ./music y ./data/indiegen,
    # no como root. Por defecto el contenedor es root, así que todo lo que
    # escribe (tracks, json, state.json, runs/, restart-request) queda root:root
    # y cualquier herramienta del host que quiera reescribirlo choca con EACCES.
    # Medido: uid 1000 contra un state.json root:root da "Permission denied", y
    # mkdir dentro de runs/ root:root también. Sin :? un despliegue nuevo
    # arrancaría en silencio con el uid equivocado y fallaría recién en el
    # primer ciclo, así que el valor es obligatorio en .env.
    user: "${INDIEGEN_UID:?falta INDIEGEN_UID en .env}:${INDIEGEN_GID:?falta INDIEGEN_GID en .env}"
    depends_on:
      - liquidsoap
    environment:
      INDIEGEN_PRESET: ${INDIEGEN_PRESET:-station}
      INDIEGEN_COUNT: ${INDIEGEN_COUNT:-10}
      INDIEGEN_SEED_BASE: ${INDIEGEN_SEED_BASE:-1000}
      INDIEGEN_SEED_STRATEGY: ${INDIEGEN_SEED_STRATEGY:-advance}
      INDIEGEN_INTERVAL_SECONDS: ${INDIEGEN_INTERVAL_SECONDS:-21600}
      INDIEGEN_RESTART: ${INDIEGEN_RESTART:-signal:/var/lib/indiegen/restart-request}
    command:
      [
        "serve",
        "--music-dir", "/music",
        "--work-dir", "/var/lib/indiegen",
        "--presets-dir", "/app/presets",
        "--preset", "${INDIEGEN_PRESET:-station}",
        "--count", "${INDIEGEN_COUNT:-10}",
        "--seed-base", "${INDIEGEN_SEED_BASE:-1000}",
        "--seed-strategy", "${INDIEGEN_SEED_STRATEGY:-advance}",
        "--interval-seconds", "${INDIEGEN_INTERVAL_SECONDS:-21600}",
        "--restart", "${INDIEGEN_RESTART:-signal:/var/lib/indiegen/restart-request}",
        "--trigger-file", "/var/lib/indiegen/trigger",
        "--no-run-on-start",
      ]
    volumes:
      - ./music:/music
      - ./data/indiegen:/var/lib/indiegen
    networks:
      - radio

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: radio-caddy
    restart: unless-stopped
    depends_on:
      - icecast
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      COOKIE_FLAGS: ${COOKIE_FLAGS:-HttpOnly; SameSite=Lax; Secure}
      # El origen del frontend (Cloudflare Pages en producción). El canje
      # redirige acá al terminar y el CORS permite este origen. En local,
      # el frontend es este mismo Caddy (http://localhost:8090).
      # OJO: sin trailing slash — se usa como origin en CORS y en el Location.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # El directorio, no los archivos: git cambia el working tree con un
      # rename+swap (nuevo inodo), y Docker bind-montea el ARCHIVO por inodo
      # — el contenedor se queda con la versión vieja para siempre y el
      # `caddy reload` recarga basura sin efecto. Con el directorio, el
      # swap se ve y el reload en caliente funciona sin reiniciar nada.
      # (La cámara de esto ya la conocemos con tokens.caddy: ahí, "escribir
      # in place" cierra porque no pasa por el git; el Caddyfile sí pasa).
      - ./caddy:/etc/caddy:ro
      - ./web:/srv:ro
      # Los segmentos de la cámara. Caddy los sirve como archivos: no hay
      # proxy, no hay otro puerto, no hay otro lugar donde autenticar.
      #
      # OJO con la ruta: NO puede ser /srv/cam. Docker monta ./web:/srv:ro
      # primero (ordena por ruta) y después no puede crear /srv/cam dentro
      # de un mount de sólo lectura: "Read-only file system (os error 30)".
      # Por eso el directorio va a /srv-cam y el Caddyfile usa handle_path.
      - ./data/cam:/srv-cam:ro
      - ./data/caddy:/data
    networks:
      - radio

networks:
  radio:
    driver: bridge
