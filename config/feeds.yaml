# Feeds for Mario's news slot.
#
# One item airs per time bucket, and the starting feed rotates with the bucket
# seed, so every feed below gets its turn over the course of a day. Feeds with
# no items this hour are skipped silently - an empty category does not get
# announced, it just does not air.
#
# Schema: a `feeds` list. Each entry is either a URL string or a mapping with
# `url` plus an optional `name`. The name is only used to derive a
# filesystem-safe slug, so keep it ASCII (an accent becomes a hyphen).
#
# An unreachable feed is not fatal: it falls back and the stream keeps going.
feeds:
